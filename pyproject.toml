[tool]
name = "viralcut-ai"
version = "0.1.0"
description = "AI-Powered Viral Video Highlight Detection and YouTube Shorts Generator"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
dependencies = {
    "fastapi" = "^0.75.0",
    "uvicorn" = "^0.17.0",
    "sqlalchemy" = "^1.4.27",
    "alembic" = "^1.7.5",
    "pydantic" = "^1.9.0",
    "celery" = "^5.2.0",
    "redis" = "^4.0.2",
    "ffmpeg-python" = "^0.2.0",
    "whisper" = "^1.0.0",
    "requests" = "^2.26.0",
    "python-dotenv" = "^0.19.2"
}

[tool.poetry.dev-dependencies]
"pytest" = "^6.2.5"
"black" = "^21.9b0"
"mypy" = "^0.910"
"flake8" = "^3.9.2"

[build]
source = ["src"]